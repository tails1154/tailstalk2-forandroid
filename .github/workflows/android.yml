name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RVX_SENTRY_DSN: ${{ vars.RVX_SENTRY_DSN }}
      RVX_ANALYSIS_ENABLED: ${{ vars.RVX_ANALYSIS_ENABLED }}
      RVX_ANALYSIS_BASEURL: ${{ vars.RVX_ANALYSIS_BASEURL }}
      RVX_DEBUG_APP_NAME: ${{ vars.RVX_DEBUG_APP_NAME }}
      RVX_BUILD_FLAVOUR_ID: ${{ vars.RVX_BUILD_FLAVOUR_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: gradle


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Provide Firebase config for CI
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Build with Gradle
        env:
          RVX_DEBUG_APP_NAME: TailsTalk 2
          TAILSTALK_RELEASE_KEYSTORE: ${{ github.workspace }}/app/ci-release.keystore
          TAILSTALK_RELEASE_STORE_PASSWORD: tails-talk-ci
          TAILSTALK_RELEASE_KEY_PASSWORD: tails-talk-ci
          TAILSTALK_RELEASE_KEY_ALIAS: tailstalk-ci
        run: |
          keytool -genkeypair -v \
            -keystore "$TAILSTALK_RELEASE_KEYSTORE" \
            -storepass "$TAILSTALK_RELEASE_STORE_PASSWORD" \
            -keypass "$TAILSTALK_RELEASE_KEY_PASSWORD" \
            -alias "$TAILSTALK_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TailsTalk 2 CI, OU=Testing, O=TailsTalk 2, C=US"
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Validate release APK and AAB
        run: |
          unzip -t app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Archive release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-android-1.0.1
          retention-days: 5
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
